name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-tauri/src-tauri -> target

      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: rust-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: openconfig-windows
          path: |
            rust-tauri/src-tauri/target/release/bundle/nsis/*.exe
            rust-tauri/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust-tauri/src-tauri/target/release/bundle/nsis/*.exe
            rust-tauri/src-tauri/target/release/bundle/msi/*.msi