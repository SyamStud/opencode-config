[package]
name = "openconfig"
version = "0.1.0"
description = "openconfig — provider & model editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
